<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, &#39;Fira Code&#39;, Monaco, Consolas, sans-serif;">
  <defs>
    <!-- Filter effects for sleek visual styling -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#3498db" flood-opacity="0.4" />
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#f39c12" flood-opacity="0.4" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#2ecc71" flood-opacity="0.4" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#e74c3c" flood-opacity="0.4" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#a855f7" flood-opacity="0.4" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="idleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="countdownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c1e38" />
      <stop offset="100%" stop-color="#1a1124" />
    </linearGradient>

    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2a38" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="evalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#382a1b" />
      <stop offset="100%" stop-color="#1f160e" />
    </linearGradient>

    <!-- Markers for Flow Arrows -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3498db" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2ecc71" />
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f39c12" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e74c3c" />
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold" letter-spacing="1">4. FLUJO DEL JUEGO (CORE 0) — MAQUINA DE ESTADOS</text>
  <text x="550" y="65" text-anchor="middle" fill="#8b949e" font-size="13">Diagrama de Transiciones de Estado y Lógica de Ejecución Real-Time</text>

  <!-- ==================== FLOW LINES (BEHIND NODES) ==================== -->

  <!-- Transition 1: IDLE -> CUENTA REGRESIVA -->
  <path d="M 550 160 L 550 210" fill="none" stroke="#3498db" stroke-width="2.5" marker-end="url(#arrowBlue)" />

  <!-- Transition 2: CUENTA REGRESIVA -> ROUND (ACTIVA) -->
  <path d="M 550 280 L 550 330" fill="none" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arrowPurple)" />

  <!-- Transition 3: ROUND (ACTIVA) -> EVALUA RESULTADO -->
  <path d="M 550 410 L 550 460" fill="none" stroke="#f39c12" stroke-width="2.5" marker-end="url(#arrowOrange)" />

  <!-- Transition 4: EVALUA RESULTADO -> REGISTRO DE STATS Y PROCESAMIENTO -->
  <path d="M 550 530 L 550 580" fill="none" stroke="#2ecc71" stroke-width="2.5" marker-end="url(#arrowGreen)" />

  <!-- Loopback 1: Direct timeout/cancel from ROUND to IDLE -->
  <path d="M 720 370 L 890 370 L 890 130 L 680 130" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowRed)" />

  <!-- Loopback 2: Reset from STATS/END to IDLE -->
  <path d="M 550 710 L 550 750 L 920 750 L 920 120 L 680 120" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)" />

  <!-- ==================== STATE NODES ==================== -->

  <!-- 1. IDLE STATE -->
  <g transform="translate(420, 95)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="260" height="65" rx="8" fill="url(#idleGrad)" stroke="#64748b" stroke-width="2" />
    <text x="130" y="38" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="bold" letter-spacing="1">IDLE</text>
  </g>

  <!-- Condition / Trigger Label 1 -->
  <g transform="translate(565, 172)">
    <rect x="0" y="0" width="310" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="155" y="17" text-anchor="middle" fill="#38bdf8" font-size="11" font-family="&#39;Fira Code&#39;, monospace">2 botones simultáneos / START_ROUND (web)</text>
  </g>

  <!-- 2. CUENTA REGRESIVA STATE -->
  <g transform="translate(370, 210)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="360" height="70" rx="8" fill="url(#countdownGrad)" stroke="#a855f7" stroke-width="2" filter="url(#glowPurple)" />
    <text x="180" y="32" text-anchor="middle" fill="#c084fc" font-size="16" font-weight="bold">CUENTA REGRESIVA</text>
    <text x="180" y="52" text-anchor="middle" fill="#e9d5ff" font-size="12" font-family="&#39;Fira Code&#39;, monospace">cuenta regresiva (start_delay_s)</text>
  </g>

  <!-- Side annotation for Countdown -->
  <g transform="translate(745, 232)">
    <text x="0" y="0" fill="#a855f7" font-size="12" font-family="&#39;Fira Code&#39;, monospace">beeps "3-2-1"</text>
  </g>

  <!-- 3. ROUND (ACTIVA) STATE -->
  <g transform="translate(380, 330)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="340" height="80" rx="8" fill="url(#activeGrad)" stroke="#3498db" stroke-width="2" filter="url(#glowBlue)" />
    <text x="170" y="34" text-anchor="middle" fill="#60a5fa" font-size="16" font-weight="bold">ROUND (activa)</text>
    <text x="170" y="58" text-anchor="middle" fill="#93c5fd" font-size="12" font-family="&#39;Fira Code&#39;, monospace">presenta LED + t0=time_us_32()</text>
  </g>

  <!-- Side annotation for Timeout -->
  <g transform="translate(735, 360)">
    <text x="0" y="0" fill="#e74c3c" font-size="11" font-family="&#39;Fira Code&#39;, monospace">espera pulsación o timeout</text>
  </g>

  <!-- 4. EVALUA RESULTADO STATE -->
  <g transform="translate(370, 460)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="360" height="70" rx="8" fill="url(#evalGrad)" stroke="#f39c12" stroke-width="2" filter="url(#glowOrange)" />
    <text x="180" y="32" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="bold">evalúa resultado</text>
    <text x="180" y="52" text-anchor="middle" fill="#fef08a" font-size="13" font-family="&#39;Fira Code&#39;, monospace">hit / miss / timeout</text>
  </g>

  <!-- 5. STATS RECORD & PROCESAMIENTO -->
  <g transform="translate(330, 580)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="440" height="130" rx="8" fill="#142e20" stroke="#2ecc71" stroke-width="2" filter="url(#glowGreen)" />
    <text x="220" y="30" text-anchor="middle" fill="#4ade80" font-size="15" font-weight="bold" font-family="&#39;Fira Code&#39;, monospace">stats_record + audio + flash</text>

    <line x1="20" y1="42" x2="420" y2="42" stroke="#275237" stroke-width="1" />

    <!-- Sub-conditions -->
    <g font-family="&#39;Fira Code&#39;, monospace" font-size="12" fill="#cbd5e1">
      <text x="220" y="64" text-anchor="middle" fill="#f87171">(SUDDEN_DEATH y fallo)</text>
      <text x="220" y="86" text-anchor="middle" fill="#fbbf24">(TIMED y fin de tiempo)</text>
      <text x="220" y="108" text-anchor="middle" fill="#94a3b8">(STOP_ROUND)</text>
    </g>
  </g>

  <!-- Reset Arrow Annotation -->
  <g transform="translate(930, 430)" font-family="&#39;Fira Code&#39;, monospace" font-size="11" fill="#64748b">
    <text x="0" y="0" transform="rotate(90 0 0)">Reiniciar juego / Retorno a IDLE</text>
  </g>
</svg>