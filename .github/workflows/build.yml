# PicoReflex — CI: compila el firmware y publica el .uf2 como artefacto.
#
# Se ejecuta en cada push y pull request. Provee el "Check status" que usa el
# proceso de release: si la build falla, no se publica el .uf2.
#
# El resultado (PicoReflex.uf2) queda disponible en el artefacto del workflow y
# puede adjuntarse a los releases.

name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar toolchain ARM y herramientas de build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib \
            git python3

      - name: Clonar Pico SDK (con submódulos)
        run: |
          git clone --depth 1 --branch 2.3.0 \
            https://github.com/raspberrypi/pico-sdk.git "${GITHUB_WORKSPACE}/../pico-sdk"
          git -C "${GITHUB_WORKSPACE}/../pico-sdk" submodule update --init --depth 1

      - name: Configurar (CMake)
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/../pico-sdk
        run: cmake -B build -S .

      - name: Compilar
        run: cmake --build build -j

      - name: Subir artefacto (.uf2)
        uses: actions/upload-artifact@v4
        with:
          name: PicoReflex-firmware
          path: build/*.uf2
          if-no-files-found: error
