name: Build & Release

# ---------------------------------------------------------------------------
# Flujo de CI/CD de PicoReflex (Raspberry Pi Pico W, Pico SDK 2.3.0).
#
#  - En cada push a `main` y en cada Pull Request: compila el firmware, ejecuta
#    análisis estático (cppcheck) y publica el reporte de tamaño de imagen
#    (.text/.rodata/.data/.bss) como artefacto.
#  - El análisis estático FALLA el CI si detecta hallazgos de nivel
#    error o warning en `src/` e `include/`.
#  - En cada push de un TAG `v*` (p. ej. v0.1.2): además crea un Release de
#    GitHub con el firmware adjunto y notas auto-generadas.
#
# Para publicar una release: actualizar CHANGELOG.md, subir la versión en
# CMakeLists.txt (pico_set_program_version) y ejecutar:
#     git tag vX.Y.Z && git push origin vX.Y.Z
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:   # Permite dispararlo manualmente desde la pestaña Actions.

permissions:
  contents: write     # Necesario para crear releases y subir artefactos.

jobs:
  build:
    name: Compilar, analizar y medir firmware (Pico W)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar toolchain ARM (arm-none-eabi-gcc) + CMake + Ninja + cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib \
            cppcheck \
            git python3

      - name: Verificar versión del compilador
        run: arm-none-eabi-gcc --version | head -n 1

      - name: Cache del pico-sdk (2.3.0)
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: pico-sdk
          key: pico-sdk-2.3.0-v1

      - name: Clonar pico-sdk (con submódulos)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 2.3.0 \
            --recurse-submodules --shallow-submodules \
            https://github.com/raspberrypi/pico-sdk.git pico-sdk

      - name: Clonar FreeRTOS-Kernel (V11.1.0)
        run: |
          git clone --depth 1 --branch V11.1.0 \
            https://github.com/FreeRTOS/FreeRTOS-Kernel.git FreeRTOS-Kernel

      - name: Configurar CMake
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
          FREERTOS_KERNEL_PATH: ${{ github.workspace }}/FreeRTOS-Kernel
        run: |
          cmake -B build -G Ninja \
            -DPICO_SDK_PATH="$PICO_SDK_PATH" \
            -DPICO_BOARD=pico_w \
            -DFREERTOS_KERNEL_PATH="$FREERTOS_KERNEL_PATH" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build

      - name: Análisis estático (cppcheck)
        run: |
          cppcheck --version
          cppcheck \
            --enable=warning,performance,portability \
            --std=c11 --std=c++17 \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=missingInclude \
            --suppress=unusedFunction \
            --suppress=uninitMemberVarNoCtor \
            -I include -I . \
            src include > cppcheck-report.txt 2>&1 || true
          cat cppcheck-report.txt
          if grep -Eq ': (error|warning):' cppcheck-report.txt; then
            echo "::error::cppcheck detectó hallazgos (error/warning). Ver cppcheck-report.txt."
            exit 1
          fi
          echo "cppcheck: sin hallazgos de nivel error/warning."

      - name: Generar reporte de tamaño (.text/.rodata/.data/.bss)
        run: |
          cmake --build build --target size
          cat build/size-report.txt

      - name: Subir artefacto (firmware)
        uses: actions/upload-artifact@v4
        with:
          name: picoreflex-firmware
          path: |
            build/*.uf2
            build/*.elf
            build/*.hex

      - name: Subir artefacto (reporte de tamaño)
        uses: actions/upload-artifact@v4
        with:
          name: picoreflex-size-report
          path: build/size-report.txt

      - name: Crear Release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.uf2
            build/*.elf
          generate_release_notes: true
